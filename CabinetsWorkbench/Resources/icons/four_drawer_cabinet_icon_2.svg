<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7dde3"/>
      <stop offset="100%" stop-color="#aab4be"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7cfd7"/>
      <stop offset="100%" stop-color="#9ca7b2"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7d8790"/>
      <stop offset="100%" stop-color="#5f6972"/>
    </linearGradient>
    <linearGradient id="plinthGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b747d"/>
      <stop offset="100%" stop-color="#59636c"/>
    </linearGradient>
  </defs>

  <!-- top -->
  <polygon points="8,11 31,0.8 57,16 36,29"
           fill="url(#topGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- right side -->
  <polygon points="36,29 57,16 57,51 36,64"
           fill="url(#sideGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- front body -->
  <polygon points="8,11 36,29 36,64 8,46.5"
           fill="url(#frontGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- drawer reveal lines -->
  <line x1="8" y1="20.2" x2="36" y2="38.4" stroke="#14181d" stroke-width="0.9"/>
  <line x1="8" y1="29.4" x2="36" y2="47.6" stroke="#14181d" stroke-width="0.9"/>
  <line x1="8" y1="38.6" x2="36" y2="56.8" stroke="#14181d" stroke-width="0.9"/>

  <!-- front-right edge emphasis -->
  <line x1="36" y1="29" x2="36" y2="64" stroke="#14181d" stroke-width="1.0"/>
  <line x1="35.0" y1="28.2" x2="35.0" y2="63.0" stroke="#606a73" stroke-width="0.45"/>

  <!-- top/front lip accent -->
  <line x1="8" y1="11" x2="36" y2="29" stroke="#14181d" stroke-width="0.85"/>
  <line x1="8.8" y1="10.2" x2="36.8" y2="28.2" stroke="#14181d" stroke-width="0.45"/>

  <!-- plinth / toe kick -->
  <polygon points="36,50 57,39.5 57,51 36,64"
           fill="url(#plinthGrad)" stroke="#14181d" stroke-width="0.8" stroke-linejoin="round"/>
  <polygon points="36,50 39.7,48.1 39.7,59.0 36,64"
           fill="#b1bac3" stroke="#14181d" stroke-width="0.72" stroke-linejoin="round"/>
</svg>
