<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8d7cf"/>
      <stop offset="100%" stop-color="#bebdb4"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#858982"/>
      <stop offset="100%" stop-color="#6c7069"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c6c3b7"/>
      <stop offset="100%" stop-color="#aaa699"/>
    </linearGradient>
    <linearGradient id="interiorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2d0d7"/>
      <stop offset="100%" stop-color="#9eafb8"/>
    </linearGradient>
  </defs>

  <!-- cabinet top -->
  <polygon points="7,13 28.7,1.7 59,20 35.6,34.8"
           fill="url(#topGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- cabinet right side -->
  <polygon points="35.6,34.8 59,20 59,48.5 35.6,64"
           fill="url(#sideGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- front face/frame -->
  <polygon points="7,13 35.6,34.8 35.6,64 7,42.2"
           fill="url(#frameGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- left open bay -->
  <polygon points="9.4,17.3 19.0,24.6 19.0,52.3 9.4,45.0"
           fill="url(#interiorGrad)" stroke="#14181d" stroke-width="0.75" stroke-linejoin="round"/>

  <!-- right open bay -->
  <polygon points="21.2,26.3 32.8,35.1 32.8,61.6 21.2,52.8"
           fill="url(#interiorGrad)" stroke="#14181d" stroke-width="0.75" stroke-linejoin="round"/>

  <!-- center stile -->
  <polygon points="19.0,24.6 21.2,26.3 21.2,52.8 19.0,52.3"
           fill="#a9a69a" stroke="#14181d" stroke-width="0.65" stroke-linejoin="round"/>

  <!-- shelves: left bay -->
  <line x1="9.9" y1="26.0" x2="18.6" y2="32.6" stroke="#758792" stroke-width="0.75"/>
  <line x1="9.9" y1="35.0" x2="18.6" y2="41.6" stroke="#758792" stroke-width="0.75"/>

  <!-- shelves: right bay -->
  <line x1="21.7" y1="35.2" x2="32.4" y2="43.3" stroke="#758792" stroke-width="0.75"/>
  <line x1="21.7" y1="44.0" x2="32.4" y2="52.1" stroke="#758792" stroke-width="0.75"/>

  <!-- shelf front edges -->
  <line x1="10.1" y1="26.5" x2="18.5" y2="32.9" stroke="#bac8cf" stroke-width="0.35"/>
  <line x1="10.1" y1="35.5" x2="18.5" y2="41.9" stroke="#bac8cf" stroke-width="0.35"/>
  <line x1="21.9" y1="35.7" x2="32.2" y2="43.6" stroke="#bac8cf" stroke-width="0.35"/>
  <line x1="21.9" y1="44.5" x2="32.2" y2="52.4" stroke="#bac8cf" stroke-width="0.35"/>

  <!-- front-right corner emphasis -->
  <line x1="35.6" y1="34.8" x2="35.6" y2="64" stroke="#14181d" stroke-width="1.0"/>

  <!-- upper front lip -->
  <line x1="7" y1="13" x2="35.6" y2="34.8" stroke="#14181d" stroke-width="0.85"/>
  <line x1="7.7" y1="12.2" x2="36.3" y2="34.0" stroke="#14181d" stroke-width="0.42"/>
</svg>
