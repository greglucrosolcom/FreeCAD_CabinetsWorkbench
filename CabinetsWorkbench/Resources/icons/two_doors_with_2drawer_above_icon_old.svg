<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7dde3"/>
      <stop offset="100%" stop-color="#aab4be"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7cfd7"/>
      <stop offset="100%" stop-color="#9ca7b2"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79838c"/>
      <stop offset="100%" stop-color="#616b74"/>
    </linearGradient>
    <linearGradient id="plinthGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b747d"/>
      <stop offset="100%" stop-color="#59636c"/>
    </linearGradient>
  </defs>

  <!-- top -->
  <polygon points="8,10 30,0.8 57,16 35,28.5"
           fill="url(#topGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- right side -->
  <polygon points="35,28.5 57,16 57,51 35,64"
           fill="url(#sideGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- front face -->
  <polygon points="8,10 35,28.5 35,64 8,45.5"
           fill="url(#frontGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- upper drawer band -->
  <line x1="8" y1="19.7" x2="35" y2="38.0" stroke="#14181d" stroke-width="0.9"/>

  <!-- lower two-door split -->
  <line x1="21.8" y1="29.2" x2="21.8" y2="55.0" stroke="#14181d" stroke-width="0.95"/>

  <!-- small right-side divider under drawer line -->
  <line x1="34.2" y1="37.4" x2="35" y2="38.0" stroke="#14181d" stroke-width="0.9"/>

  <!-- front-right edge emphasis -->
  <line x1="35" y1="28.5" x2="35" y2="64" stroke="#14181d" stroke-width="1.0"/>
  <line x1="34.0" y1="27.7" x2="34.0" y2="63.0" stroke="#606a73" stroke-width="0.45"/>

  <!-- top/front lip accent -->
  <line x1="8" y1="10" x2="35" y2="28.5" stroke="#14181d" stroke-width="0.85"/>
  <line x1="8.8" y1="9.2" x2="35.8" y2="27.7" stroke="#14181d" stroke-width="0.45"/>

  <!-- plinth / toe kick -->
  <polygon points="35,50 57,39.5 57,51 35,64"
           fill="url(#plinthGrad)" stroke="#14181d" stroke-width="0.8" stroke-linejoin="round"/>
  <polygon points="35,50 38.8,48.2 38.8,58.8 35,64"
           fill="#b1bac3" stroke="#14181d" stroke-width="0.72" stroke-linejoin="round"/>
</svg>
