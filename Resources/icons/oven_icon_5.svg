<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7dde3"/>
      <stop offset="100%" stop-color="#aab4be"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7cfd7"/>
      <stop offset="100%" stop-color="#9ca7b2"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79838c"/>
      <stop offset="100%" stop-color="#616b74"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a7f0a5"/>
      <stop offset="100%" stop-color="#98ea99"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#98a4b0"/>
      <stop offset="100%" stop-color="#6d7a86"/>
    </linearGradient>
  </defs>

  <!-- top surface -->
  <polygon points="10,12 31.5,0.8 60,15.5 37.5,28.0" fill="url(#topGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- burners -->
  <g fill="#b0b7bf" stroke="#14181d" stroke-width="0.8">
    <ellipse cx="17.8" cy="10.4" rx="4.1" ry="2.5" transform="rotate(-10 17.8 10.4)"/>
    <ellipse cx="28.0" cy="5.1" rx="4.4" ry="2.7" transform="rotate(-10 28.0 5.1)"/>
    <ellipse cx="43.6" cy="13.9" rx="4.0" ry="2.5" transform="rotate(-10 43.6 13.9)"/>
    <ellipse cx="34.2" cy="18.7" rx="4.2" ry="2.6" transform="rotate(-10 34.2 18.7)"/>
  </g>
  <!-- slight burner shadow rings -->
  <g fill="none" stroke="#31383f" stroke-width="0.55" opacity="0.9">
    <ellipse cx="18.4" cy="11.0" rx="4.2" ry="2.6" transform="rotate(-10 18.4 11.0)"/>
    <ellipse cx="28.7" cy="5.8" rx="4.5" ry="2.8" transform="rotate(-10 28.7 5.8)"/>
    <ellipse cx="44.3" cy="14.5" rx="4.1" ry="2.6" transform="rotate(-10 44.3 14.5)"/>
    <ellipse cx="34.9" cy="19.3" rx="4.3" ry="2.7" transform="rotate(-10 34.9 19.3)"/>
  </g>

  <!-- right side -->
  <polygon points="37.5,28.0 60,15.5 60,51.0 37.5,64.0" fill="url(#sideGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- main front body -->
  <polygon points="10,12 37.5,28.0 37.5,64.0 10,47.5" fill="url(#frontGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- green control panel -->
  <polygon points="10,12 37.5,28.0 37.5,34.2 10,18.4" fill="url(#panelGrad)" stroke="#14181d" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- knobs -->
  <g fill="#a8afb7" stroke="#14181d" stroke-width="0.7">
    <ellipse cx="8.4" cy="18.1" rx="1.6" ry="1.25" transform="rotate(58 8.4 18.1)"/>
    <ellipse cx="16.0" cy="22.5" rx="1.6" ry="1.25" transform="rotate(58 16.0 22.5)"/>
    <ellipse cx="24.4" cy="27.2" rx="1.6" ry="1.25" transform="rotate(58 24.4 27.2)"/>
    <ellipse cx="32.3" cy="31.8" rx="1.6" ry="1.25" transform="rotate(58 32.3 31.8)"/>
    <ellipse cx="37.0" cy="34.3" rx="1.2" ry="0.95" transform="rotate(58 37.0 34.3)" opacity="0"/>
  </g>
  <g stroke="#4d565e" stroke-width="0.7" stroke-linecap="round">
    <line x1="9.0" y1="17.1" x2="9.8" y2="18.0"/>
    <line x1="16.6" y1="21.5" x2="17.4" y2="22.4"/>
    <line x1="25.0" y1="26.1" x2="25.9" y2="27.0"/>
    <line x1="32.8" y1="30.7" x2="33.7" y2="31.6"/>
  </g>

  <!-- divider between panel and oven door -->
  <line x1="10" y1="18.4" x2="37.5" y2="34.2" stroke="#14181d" stroke-width="0.85"/>

  <!-- oven door panel -->
  <polygon points="11.5,25.0 35.8,39.0 35.8,61.5 11.5,46.8" fill="#b7c0c9" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>
  <line x1="12.2" y1="24.3" x2="36.4" y2="38.4" stroke="#d9e1e7" stroke-width="0.8" opacity="0.9"/>
  <line x1="35.8" y1="39.0" x2="35.8" y2="61.5" stroke="#14181d" stroke-width="0.95"/>

  <!-- body edge emphasis -->
  <line x1="37.5" y1="28.0" x2="37.5" y2="64.0" stroke="#14181d" stroke-width="1.05"/>
</svg>
