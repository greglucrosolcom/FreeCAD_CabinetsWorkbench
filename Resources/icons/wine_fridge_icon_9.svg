<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8d8d2"/>
      <stop offset="100%" stop-color="#bdbdb6"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7f8584"/>
      <stop offset="100%" stop-color="#676d6d"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c3d40"/>
      <stop offset="100%" stop-color="#242629"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a9bfcc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8ea5b3" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#33363a"/>
      <stop offset="100%" stop-color="#212428"/>
    </linearGradient>
  </defs>

  <!-- top -->
  <polygon points="10,11 33,0.8 58,15.5 35,28.2"
           fill="url(#topGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- right side -->
  <polygon points="35,28.2 58,15.5 58,51 35,64"
           fill="url(#bodyGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- front body -->
  <polygon points="10,11 35,28.2 35,64 10,46.7"
           fill="#5f6364" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- recessed base / plinth -->
  <polygon points="35,50.5 58,39.5 58,51 35,64"
           fill="url(#baseGrad)" stroke="#14181d" stroke-width="0.8" stroke-linejoin="round"/>
  <polygon points="35,50.5 38.9,48.7 38.9,58.8 35,64"
           fill="#44484d" stroke="#14181d" stroke-width="0.72" stroke-linejoin="round"/>

  <!-- door frame outer -->
  <polygon points="10,11 35,28.2 35,64 10,46.7"
           fill="url(#frameGrad)" stroke="#14181d" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- inner glass opening -->
  <polygon points="13.3,16.7 29.4,27.8 29.4,51.7 13.3,40.6"
           fill="url(#glassGrad)" stroke="#14181d" stroke-width="0.75" stroke-linejoin="round"/>

  <!-- bottom interior shelf/floor -->
  <polygon points="13.7,38.6 29.0,49.2 29.0,51.7 13.7,41.1"
           fill="#bed0d9" stroke="#7c8f9a" stroke-width="0.45" stroke-linejoin="round" opacity="0.95"/>

  <!-- frame thickness indications -->
  <line x1="15.2" y1="14.6" x2="31.1" y2="25.6" stroke="#4a4d51" stroke-width="0.7"/>
  <line x1="12.8" y1="16.2" x2="12.8" y2="40.9" stroke="#4a4d51" stroke-width="0.7"/>
  <line x1="29.9" y1="27.6" x2="29.9" y2="52.1" stroke="#4a4d51" stroke-width="0.7"/>
  <line x1="13.0" y1="41.1" x2="29.0" y2="52.2" stroke="#4a4d51" stroke-width="0.7"/>

  <!-- front-right edge emphasis -->
  <line x1="35" y1="28.2" x2="35" y2="64" stroke="#14181d" stroke-width="1.0"/>
  <line x1="34.0" y1="27.5" x2="34.0" y2="63.0" stroke="#2d3135" stroke-width="0.45"/>

  <!-- top lip accent -->
  <line x1="10" y1="11" x2="35" y2="28.2" stroke="#14181d" stroke-width="0.85"/>
  <line x1="10.7" y1="10.2" x2="35.7" y2="27.4" stroke="#14181d" stroke-width="0.45"/>
</svg>
