<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7dde3"/>
      <stop offset="100%" stop-color="#aab4be"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7cfd7"/>
      <stop offset="100%" stop-color="#9ca7b2"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7d8790"/>
      <stop offset="100%" stop-color="#5f6972"/>
    </linearGradient>
  </defs>

  <!-- Top -->
  <polygon points="52,49 128,10 212,59 130,101"
           fill="url(#topGrad)" stroke="#111820" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Right side -->
  <polygon points="130,101 212,59 212,190 130,232"
           fill="url(#sideGrad)" stroke="#111820" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Front body -->
  <polygon points="52,49 130,101 130,232 52,187"
           fill="url(#frontGrad)" stroke="#111820" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Drawer reveal lines -->
  <line x1="52" y1="82" x2="130" y2="127" stroke="#111820" stroke-width="2.2"/>
  <line x1="52" y1="114" x2="130" y2="159" stroke="#111820" stroke-width="2.2"/>
  <line x1="52" y1="146" x2="130" y2="191" stroke="#111820" stroke-width="2.2"/>

  <!-- Slight drawer-front edge at right -->
  <line x1="126.5" y1="99" x2="126.5" y2="230" stroke="#606a73" stroke-width="1.6"/>

  <!-- Toe kick / plinth -->
  <polygon points="130,205 212,164 212,190 130,232"
           fill="#68727b" stroke="#111820" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="130,205 147,196 147,220 130,232"
           fill="#aeb8c2" stroke="#111820" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Front corner emphasis -->
  <line x1="130" y1="101" x2="130" y2="232" stroke="#111820" stroke-width="2.6"/>

  <!-- Outer top/front edge accent -->
  <line x1="52" y1="49" x2="130" y2="101" stroke="#111820" stroke-width="2.4"/>
</svg>
