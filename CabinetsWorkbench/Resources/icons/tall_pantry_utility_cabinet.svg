<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7dde3"/>
      <stop offset="100%" stop-color="#aab4be"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7cfd7"/>
      <stop offset="100%" stop-color="#9ca7b2"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79838c"/>
      <stop offset="100%" stop-color="#616b74"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34383d"/>
      <stop offset="100%" stop-color="#23272b"/>
    </linearGradient>
  </defs>

  <!-- top -->
  <polygon points="10,7 24,0.8 45,15 34,24"
           fill="url(#topGrad)" stroke="#14181d" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- right side -->
  <polygon points="34,24 45,15 45,59 34,64"
           fill="url(#sideGrad)" stroke="#14181d" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- front face -->
  <polygon points="10,7 34,24 34,64 10,46.5"
           fill="url(#frontGrad)" stroke="#14181d" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- face frame outer emphasis -->
  <line x1="10.9" y1="8.0" x2="33.0" y2="23.7" stroke="#14181d" stroke-width="0.65"/>
  <line x1="11.0" y1="7.8" x2="11.0" y2="46.0" stroke="#14181d" stroke-width="0.65"/>
  <line x1="33.0" y1="24.0" x2="33.0" y2="63.2" stroke="#14181d" stroke-width="0.65"/>

  <!-- major horizontal divisions -->
  <line x1="10" y1="23.2" x2="34" y2="40.3" stroke="#14181d" stroke-width="0.85"/>
  <line x1="10" y1="32.0" x2="34" y2="49.0" stroke="#14181d" stroke-width="0.85"/>
  <line x1="10" y1="36.8" x2="34" y2="53.8" stroke="#14181d" stroke-width="0.85"/>
  <line x1="10" y1="42.0" x2="34" y2="59.0" stroke="#14181d" stroke-width="0.85"/>

  <!-- vertical divisions -->
  <line x1="21.2" y1="14.8" x2="21.2" y2="31.0" stroke="#14181d" stroke-width="0.85"/>
  <line x1="21.2" y1="23.7" x2="21.2" y2="39.8" stroke="#14181d" stroke-width="0.85"/>

  <!-- top left tall panel -->
  <polygon points="11.9,10.0 20.0,15.7 20.0,29.0 11.9,23.3"
           fill="none" stroke="#14181d" stroke-width="0.75" stroke-linejoin="round"/>
  <!-- top right tall panel -->
  <polygon points="22.2,17.4 31.8,24.2 31.8,37.3 22.2,30.5"
           fill="none" stroke="#14181d" stroke-width="0.75" stroke-linejoin="round"/>

  <!-- middle left panel -->
  <polygon points="11.8,24.8 20.0,30.6 20.0,37.4 11.8,31.6"
           fill="none" stroke="#14181d" stroke-width="0.75" stroke-linejoin="round"/>
  <!-- middle right panel -->
  <polygon points="22.2,32.2 31.8,39.0 31.8,45.9 22.2,39.1"
           fill="none" stroke="#14181d" stroke-width="0.75" stroke-linejoin="round"/>

  <!-- thin drawer front -->
  <polygon points="12.0,34.2 30.6,47.4 30.6,49.1 12.0,35.8"
           fill="none" stroke="#14181d" stroke-width="0.7" stroke-linejoin="round"/>

  <!-- lower drawer front -->
  <polygon points="12.0,38.6 30.6,51.8 30.6,55.1 12.0,41.9"
           fill="none" stroke="#14181d" stroke-width="0.75" stroke-linejoin="round"/>

  <!-- bottom large panel -->
  <polygon points="12.0,43.8 30.6,57.0 30.6,63.0 12.0,49.8"
           fill="none" stroke="#14181d" stroke-width="0.75" stroke-linejoin="round"/>

  <!-- front-right edge emphasis -->
  <line x1="34" y1="24" x2="34" y2="64" stroke="#14181d" stroke-width="0.95"/>
  <line x1="33.1" y1="23.3" x2="33.1" y2="63.1" stroke="#5f6972" stroke-width="0.42"/>

  <!-- toe kick / plinth -->
  <polygon points="34,58 45,53 45,59 34,64"
           fill="url(#baseGrad)" stroke="#14181d" stroke-width="0.75" stroke-linejoin="round"/>
  <polygon points="34,58 36.7,56.8 36.7,62.8 34,64"
           fill="#4a4f55" stroke="#14181d" stroke-width="0.68" stroke-linejoin="round"/>
</svg>
